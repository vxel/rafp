<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- rafp: continuous-feed listing paper (mainframe print) under a magnifier.
       Colors from the GNOME palette. -->
  <defs>
    <clipPath id="lens">
      <circle cx="80" cy="80" r="21"/>
    </clipPath>
  </defs>

  <!-- Paper, with its bottom edge (depth). -->
  <rect x="16" y="14" width="88" height="98" rx="4" fill="#c0bfbc"/>
  <rect x="16" y="10" width="88" height="98" rx="4" fill="#ffffff"/>

  <!-- Green bars of listing paper. -->
  <g fill="#c3efcf">
    <rect x="29" y="14" width="62" height="10"/>
    <rect x="29" y="34" width="62" height="10"/>
    <rect x="29" y="54" width="62" height="10"/>
    <rect x="29" y="74" width="62" height="10"/>
    <rect x="29" y="94" width="62" height="10"/>
  </g>

  <!-- Printed lines. -->
  <g stroke="#9a9996" stroke-width="3" stroke-linecap="round">
    <path d="M34 19h34M34 29h48M34 39h26M34 49h42M34 59h38M34 69h22M34 79h40M34 89h30M34 99h44"/>
  </g>

  <!-- Tractor-feed margins: perforation lines and sprocket holes. -->
  <g stroke="#c0bfbc" stroke-width="1.5" stroke-dasharray="3 3">
    <path d="M28.5 10v98M91.5 10v98"/>
  </g>
  <g fill="#c0bfbc">
    <circle cx="22" cy="18" r="2.75"/><circle cx="22" cy="30" r="2.75"/><circle cx="22" cy="42" r="2.75"/>
    <circle cx="22" cy="54" r="2.75"/><circle cx="22" cy="66" r="2.75"/><circle cx="22" cy="78" r="2.75"/>
    <circle cx="22" cy="90" r="2.75"/><circle cx="22" cy="102" r="2.75"/>
    <circle cx="98" cy="18" r="2.75"/><circle cx="98" cy="30" r="2.75"/><circle cx="98" cy="42" r="2.75"/>
    <circle cx="98" cy="54" r="2.75"/><circle cx="98" cy="66" r="2.75"/><circle cx="98" cy="78" r="2.75"/>
    <circle cx="98" cy="90" r="2.75"/><circle cx="98" cy="102" r="2.75"/>
  </g>

  <!-- Magnifier handle, with its depth. -->
  <path d="M97 99l16 16" stroke="#241f31" stroke-width="12" stroke-linecap="round"/>
  <path d="M97 96l16 16" stroke="#5e5c64" stroke-width="12" stroke-linecap="round"/>

  <!-- Lens: the listing, magnified. -->
  <circle cx="80" cy="80" r="21" fill="#ffffff"/>
  <g clip-path="url(#lens)">
    <rect x="56" y="66" width="48" height="18" fill="#c3efcf"/>
    <path d="M62 75h30M62 93h22" stroke="#77767b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="80" r="21" fill="#99c1f1" fill-opacity="0.25"/>
  </g>

  <!-- Lens rim, with its depth. -->
  <circle cx="80" cy="82" r="22" fill="none" stroke="#241f31" stroke-width="7"/>
  <circle cx="80" cy="80" r="22" fill="none" stroke="#3d3846" stroke-width="7"/>
  <path d="M65 68a19 19 0 0 1 12-7" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
</svg>
