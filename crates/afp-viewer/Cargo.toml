[package]
name = "afp-viewer"
description = "Desktop viewer and inspector for AFP files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "rafp"
path = "src/main.rs"

[dependencies]
afp-core = { workspace = true, features = ["pdf"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }

# Debian package: tools/build-deb.sh stages the generated desktop entry,
# file type and translations in target/deb-assets, then runs cargo deb.
[package.metadata.deb]
name = "rafp"
maintainer = "Cédric de Launois <vxel@users.noreply.github.com>"
copyright = "2026 Cédric de Launois, 2026 Keith Lutz"
license-file = ["../../LICENSE", "0"]
section = "graphics"
priority = "optional"
depends = "$auto"
extended-description = """\
rafp reads and inspects AFP (Advanced Function Presentation / MO:DCA) print \
files. It shows every structured field with a readable decode beside the \
rendered page, links the two, and exports pages as PDF, SVG or PNG."""
assets = [
    ["target/release/rafp", "usr/bin/", "755"],
    ["../../target/deb-assets/share/**/*", "usr/share/", "644"],
    ["../../README.md", "usr/share/doc/rafp/", "644"],
]
