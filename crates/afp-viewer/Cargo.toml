[package]
name = "afp-viewer"
description = "Desktop viewer and inspector for AFP files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rafp"
path = "src/main.rs"

[dependencies]
afp-core = { workspace = true, features = ["pdf"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
