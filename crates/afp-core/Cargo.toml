[package]
name = "afp-core"
description = "AFP (MO:DCA) parsing, inspection and page rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Rasterize page SVGs to RGBA pixmaps with resvg.
raster = ["dep:resvg"]
# Export pages as PDF (vector, selectable text) with krilla.
pdf = ["raster", "dep:krilla", "dep:krilla-svg"]

[dependencies]
base64 = "0.23"
crc32fast = "1.5"
encoding_rs = "0.8"
flate2 = "1.1"
indexmap = "2"
log = "0.4"
regex = "1"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.47", optional = true }
krilla-svg = { version = "0.8.1", optional = true }
krilla = { version = "0.8.2", optional = true }
